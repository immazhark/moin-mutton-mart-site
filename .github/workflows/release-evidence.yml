name: Isolated release evidence
on:
  pull_request:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/release-evidence.yml'
      - 'tests/support/release-evidence.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  laboratory:
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop, accessibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODE: ${{ matrix.mode }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Build disconnected preview only
        run: |
          unset PUBLIC_FIREBASE_API_KEY PUBLIC_FIREBASE_AUTH_DOMAIN PUBLIC_FIREBASE_PROJECT_ID PUBLIC_FIREBASE_APP_ID PUBLIC_FIREBASE_ALLOWED_HOST
          test ! -e .env && test ! -e .env.local && test ! -e .env.production && test ! -e .env.production.local
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install exact isolated evidence tools and audit before execution
        run: |
          tools="$RUNNER_TEMP/moin-evidence-tools"
          mkdir -p "$tools"
          if [ "$MODE" = accessibility ]; then
            npm install --prefix "$tools" --ignore-scripts --save-exact --no-audit --no-fund axe-core@4.14.1 pa11y@10.0.0
          else
            npm install --prefix "$tools" --ignore-scripts --save-exact --no-audit --no-fund lighthouse@13.6.0
          fi
          npm audit --prefix "$tools" --audit-level=high
          echo "MOIN_EVIDENCE_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Capture laboratory evidence (not a release pass)
        run: |
          export MOIN_EVIDENCE_DIR="$RUNNER_TEMP/moin-evidence-$MODE"
          mkdir -p "$MOIN_EVIDENCE_DIR"
          echo "MOIN_EVIDENCE_DIR=$MOIN_EVIDENCE_DIR" >> "$GITHUB_ENV"
          python3 tests/support/serve-preview.py 4324 dist > "$MOIN_EVIDENCE_DIR/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4324/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4324/ >/dev/null
          node tests/support/release-evidence.mjs
      - name: Preserve actual evidence and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moin-lab-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/moin-evidence-${{ matrix.mode }}
          if-no-files-found: warn
          retention-days: 14
