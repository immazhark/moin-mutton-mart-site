name: Firebase SDK dependency audit
on:
  pull_request:
    branches: ['feat/premium-counter-redesign']
    paths: ['package.json', 'package-lock.json', '.github/workflows/sdk-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Report runtime and full dependency advisories
        run: |
          for mode in runtime all; do
            args=""
            if test "$mode" = runtime; then args="--omit=dev"; fi
            npm audit $args --json > "audit-$mode.json" || true
            node -e 'const a=require("./audit-"+process.argv[1]+".json"); if(!a.metadata||!a.vulnerabilities)throw Error("Audit unavailable"); console.log(JSON.stringify({mode:process.argv[1],counts:a.metadata.vulnerabilities,advisories:Object.entries(a.vulnerabilities).map(([name,v])=>({name,severity:v.severity,range:v.range,isDirect:v.isDirect,via:v.via,fixAvailable:v.fixAvailable}))},null,2));' "$mode"
          done
