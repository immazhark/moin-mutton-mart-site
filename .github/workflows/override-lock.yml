name: Security override lockfile regeneration
on:
  pull_request:
    branches: ['feat/premium-counter-redesign']
    paths: ['firebase/package.json', '.github/workflows/override-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve patched gRPC and regenerate npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          node -e 'const p=require("./package-lock.json");for(const d of Object.values(p.packages)){if(d.resolved&&!d.resolved.startsWith("https://registry.npmjs.org/"))throw Error("Unexpected registry URL");}'
          sha256sum package-lock.json
          base64 -w 1000 package-lock.json | sed 's/^/PATCHED_LOCK_CHUNK:/'
