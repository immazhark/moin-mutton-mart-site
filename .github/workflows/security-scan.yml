name: Repository security scan
on:
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'chore/chatgpt-release-evidence'
permissions:
  contents: read
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history with pinned Gitleaks image
        run: |
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb'
          docker pull "$image"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" "$image" \
            git --redact=100 --no-banner --log-opts="--all" /repo
