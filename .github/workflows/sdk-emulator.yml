name: Firebase SDK transaction verification
on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'src/lib/catalogue/**'
      - 'src/lib/order/**'
      - 'src/components/**'
      - 'src/scripts/**'
      - 'src/assets/**'
      - 'src/styles/**'
      - 'tests/support/**'
      - 'src/pages/**'
      - 'src/data/**'
      - 'tests/browser-emulator/**'
      - 'tests/emulator/**'
      - 'package*.json'
      - 'vitest.emulator.config.mjs'
      - '.github/workflows/sdk-emulator.yml'
permissions:
  contents: read
concurrency:
  group: sdk-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm ci --ignore-scripts --prefix firebase
      - run: npm audit --audit-level=high --prefix firebase
      - name: Select Java 21
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Run real SDK transaction tests against loopback only
        run: ./firebase/node_modules/.bin/firebase emulators:exec --config firebase/firebase.json --project demo-moin-security --only firestore 'npm run test:emulator'
      - name: Install Chromium for isolated configured journey
        run: npx playwright install --with-deps chromium
      - name: Run real browser against loopback Firestore emulator only
        run: ./firebase/node_modules/.bin/firebase emulators:exec --config firebase/firebase.json --project demo-moin-security --only firestore,auth 'bash tests/browser-emulator/run.sh'
